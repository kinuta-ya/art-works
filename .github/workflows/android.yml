# Tube Player（試作版）の APK を作る。
# 作った APK は、このワークフローの成果物（Artifacts）と、リリース「android-debug」に置く。
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK はランナーに最初から入っている（ANDROID_HOME）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK を作る
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: ファイル名を整える
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TubePlayer-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TubePlayer-debug
          path: TubePlayer-debug.apk

      - name: リリース「android-debug」に置く
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Tube Player 試作版（最新）
          prerelease: true
          files: TubePlayer-debug.apk
          body: |
            M8T 用の試作版です（自動で作り直しています）。
            TubePlayer-debug.apk をダウンロードして SD カードにコピーし、M8T のファイルマネージャーから開いてインストールしてください。
            ビルド: ${{ github.sha }}

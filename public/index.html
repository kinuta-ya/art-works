<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#1a0e36">
        <meta name="description" content="音に何も足さない、ダイナミックに再生する音楽プレイヤー（Web デモ）">
        <title>Tube Player</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;700&display=swap">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="app">
            <nav class="sidebar" aria-label="メインメニュー">
                <div class="brand"><span class="brand-dot"></span><span>Tube Player<small>BIT-PERFECT / M8T</small></span></div>
                <div class="nav" data-navgroup></div>
            </nav>

            <main id="view" class="view" tabindex="-1"></main>

            <div class="mini" id="mini" hidden>
                <button class="mini-open" data-action="open-now" aria-label="再生画面を開く">
                    <span class="disc"><img class="mini-art" alt=""></span>
                    <span class="mini-text">
                        <span class="mini-title"></span>
                        <span class="mini-sub"></span>
                    </span>
                </button>
                <span class="mini-badge badge" data-pure-badge></span>
                <button class="icon-btn" data-action="toggle" aria-label="再生/一時停止" data-playicon></button>
                <button class="icon-btn" data-action="next" aria-label="次の曲" data-icon="next"></button>
                <div class="mini-progress"><span></span></div>
            </div>

            <nav class="tabbar" aria-label="メインメニュー">
                <div class="nav" data-navgroup></div>
            </nav>
        </div>

        <section class="now" id="now" aria-label="再生中" hidden>
            <div class="now-bg" aria-hidden="true"><div class="sun"></div><div class="floor"></div></div>
            <div class="now-inner">
                <header class="now-head">
                    <button class="icon-btn" data-action="close-now" aria-label="閉じる" data-icon="down"></button>
                    <span class="now-label">NOW PLAYING</span>
                    <span class="spacer"></span>
                </header>
                <button class="now-disc-wrap" data-action="toggle" aria-label="再生/一時停止">
                    <span class="disc"><img class="now-art" alt=""></span>
                </button>
                <div class="now-meta">
                    <div class="now-title"></div>
                    <div class="now-sub"></div>
                </div>
                <div class="scrub">
                    <input type="range" class="seek" min="0" max="1000" value="0" aria-label="再生位置">
                    <div class="times"><span class="t-pos">0:00</span><span class="t-dur">0:00</span></div>
                </div>
                <div class="controls">
                    <button class="icon-btn toggle-btn" data-action="shuffle" aria-label="シャッフル" data-icon="shuffle"></button>
                    <button class="icon-btn big" data-action="prev" aria-label="前の曲" data-icon="prev"></button>
                    <button class="icon-btn huge" data-action="toggle" aria-label="再生/一時停止" data-playicon></button>
                    <button class="icon-btn big" data-action="next" aria-label="次の曲" data-icon="next"></button>
                    <button class="icon-btn toggle-btn" data-action="repeat" aria-label="リピート" data-icon="repeat"></button>
                </div>

                <div class="seg" role="radiogroup" aria-label="ノンストップモード">
                    <button role="radio" data-action="mode" data-mode="gapless">ギャップレス</button>
                    <button role="radio" data-action="mode" data-mode="crossfade">スマートクロスフェード</button>
                </div>
                <p class="transition-hint"></p>

                <div class="card signal">
                    <div class="card-head">
                        <span>信号経路</span>
                        <span class="badge" data-pure-badge></span>
                    </div>
                    <ol class="stages"></ol>
                </div>

                <div class="card">
                    <div class="card-head">
                        <span>アプリ内音量</span>
                        <span class="vol-label"></span>
                    </div>
                    <input type="range" class="volume" min="0" max="100" value="100" aria-label="アプリ内音量">
                    <p class="note">100% のときは処理しません。音量は DAP 本体のボリュームで調整するのがおすすめです。</p>
                </div>

                <div class="card">
                    <div class="card-head"><span>次に再生</span></div>
                    <ol class="queue"></ol>
                </div>
            </div>
        </section>

        <input type="file" id="pick-dir" webkitdirectory multiple hidden>
        <input type="file" id="pick-files" multiple hidden accept="audio/*,.flac,.m4a,.alac,.wav,.aif,.aiff,.mp3,.ogg,.opus,.dsf,.dff,.jpg,.jpeg,.png">
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script src="js/metadata.js"></script>
        <script src="js/eq.js"></script>
        <script src="js/analysis.js"></script>
        <script src="js/demo-tracks.js"></script>
        <script src="js/hearing.js"></script>
        <script src="js/engine.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
